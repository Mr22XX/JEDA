name: Uji engine dan build WASM

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/build-wasm.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Uji engine
        run: cargo test --manifest-path engine/Cargo.toml

      - name: Pasang wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build WASM
        run: wasm-pack build engine --target web --release --out-dir ../web/src/wasm --out-name jeda_engine

      - name: Hapus .gitignore bawaan wasm-pack
        run: rm -f web/src/wasm/.gitignore

      - name: Commit hasil build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/wasm
          git diff --cached --quiet || (git commit -m "chore: build WASM otomatis" && git push)