<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5b3fff"/>
    </marker>
  </defs>
  <rect width="900" height="460" rx="16" fill="#f5f4ff"/>

  <rect x="20" y="20" width="860" height="420" rx="14" fill="none" stroke="#7f78c8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="40" y="46" font-size="14" font-weight="700" fill="#15123b">Browser pengguna: semua berjalan di sini, tanpa server</text>

  <!-- React UI -->
  <rect x="50" y="90" width="200" height="130" rx="12" fill="#ffffff" stroke="#5b3fff" stroke-width="2"/>
  <text x="150" y="118" font-size="16" font-weight="800" fill="#15123b" text-anchor="middle">React UI</text>
  <text x="150" y="138" font-size="12" fill="#5e5a8a" text-anchor="middle">web/src (Vite + Tailwind)</text>
  <text x="150" y="166" font-size="13" fill="#15123b" text-anchor="middle">Cek · Latihan</text>
  <text x="150" y="186" font-size="13" fill="#15123b" text-anchor="middle">Darurat · Tentang</text>
  <text x="150" y="208" font-size="12" fill="#5e5a8a" text-anchor="middle">ID / EN · terang / gelap</text>

  <!-- engine.ts -->
  <rect x="50" y="270" width="200" height="90" rx="12" fill="#ffffff" stroke="#5b3fff" stroke-width="2"/>
  <text x="150" y="302" font-size="16" font-weight="800" fill="#15123b" text-anchor="middle">engine.ts</text>
  <text x="150" y="324" font-size="12" fill="#5e5a8a" text-anchor="middle">muat WASM, kirim teks,</text>
  <text x="150" y="342" font-size="12" fill="#5e5a8a" text-anchor="middle">baca hasil JSON</text>
  <line x1="150" y1="220" x2="150" y2="268" stroke="#5b3fff" stroke-width="2" marker-end="url(#a)"/>

  <!-- WASM engine -->
  <rect x="330" y="64" width="520" height="352" rx="14" fill="#ffffff" stroke="#e5640f" stroke-width="2"/>
  <text x="590" y="90" font-size="16" font-weight="800" fill="#15123b" text-anchor="middle">Mesin aturan (Rust → WASM)</text>
  <text x="590" y="108" font-size="12" fill="#5e5a8a" text-anchor="middle">engine/ · fungsi analyze(text) dan analyze_link(url)</text>

  <!-- pipeline analyze -->
  <text x="348" y="138" font-size="12" font-weight="700" fill="#e5640f">analyze(text)</text>
  <rect x="348" y="148" width="100" height="78" rx="10" fill="#f5f4ff" stroke="#7f78c8"/>
  <text x="398" y="172" font-size="13" font-weight="700" fill="#15123b" text-anchor="middle">norm.rs</text>
  <text x="398" y="190" font-size="11" fill="#5e5a8a" text-anchor="middle">pulihkan huruf</text>
  <text x="398" y="205" font-size="11" fill="#5e5a8a" text-anchor="middle">&amp; angka samaran</text>

  <rect x="470" y="148" width="100" height="78" rx="10" fill="#f5f4ff" stroke="#7f78c8"/>
  <text x="520" y="172" font-size="13" font-weight="700" fill="#15123b" text-anchor="middle">lib.rs</text>
  <text x="520" y="190" font-size="11" fill="#5e5a8a" text-anchor="middle">cocokkan regex</text>
  <text x="520" y="205" font-size="11" fill="#5e5a8a" text-anchor="middle">dari rules.json</text>

  <rect x="592" y="148" width="100" height="78" rx="10" fill="#f5f4ff" stroke="#7f78c8"/>
  <text x="642" y="172" font-size="13" font-weight="700" fill="#15123b" text-anchor="middle">domain.rs</text>
  <text x="642" y="190" font-size="11" fill="#5e5a8a" text-anchor="middle">domain meniru</text>
  <text x="642" y="205" font-size="11" fill="#5e5a8a" text-anchor="middle">merek (D01–D04)</text>

  <rect x="714" y="148" width="118" height="78" rx="10" fill="#f5f4ff" stroke="#7f78c8"/>
  <text x="773" y="172" font-size="13" font-weight="700" fill="#15123b" text-anchor="middle">Penilaian</text>
  <text x="773" y="190" font-size="11" fill="#5e5a8a" text-anchor="middle">skor + kombo →</text>
  <text x="773" y="205" font-size="11" fill="#5e5a8a" text-anchor="middle">level waspada</text>

  <line x1="448" y1="187" x2="468" y2="187" stroke="#5b3fff" stroke-width="2" marker-end="url(#a)"/>
  <line x1="570" y1="187" x2="590" y2="187" stroke="#5b3fff" stroke-width="2" marker-end="url(#a)"/>
  <line x1="692" y1="187" x2="712" y2="187" stroke="#5b3fff" stroke-width="2" marker-end="url(#a)"/>

  <!-- link -->
  <text x="348" y="258" font-size="12" font-weight="700" fill="#e5640f">analyze_link(url)</text>
  <rect x="348" y="268" width="484" height="52" rx="10" fill="#f5f4ff" stroke="#7f78c8"/>
  <text x="590" y="290" font-size="13" font-weight="700" fill="#15123b" text-anchor="middle">link.rs</text>
  <text x="590" y="308" font-size="11" fill="#5e5a8a" text-anchor="middle">baca bentuk URL (situs tidak dibuka) → aturan L01–L25 + domain.rs</text>

  <!-- rules.json -->
  <rect x="348" y="342" width="484" height="56" rx="10" fill="#fff4e8" stroke="#e5640f" stroke-dasharray="5 4"/>
  <text x="590" y="365" font-size="13" font-weight="700" fill="#15123b" text-anchor="middle">engine/rules.json</text>
  <text x="590" y="384" font-size="11" fill="#5e5a8a" text-anchor="middle">aturan, merek, kombo · ditanam saat build (include_str!)</text>
  <line x1="520" y1="342" x2="520" y2="228" stroke="#e5640f" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- engine.ts <-> wasm -->
  <line x1="250" y1="300" x2="328" y2="300" stroke="#5b3fff" stroke-width="2" marker-end="url(#a)"/>
  <text x="289" y="292" font-size="11" fill="#15123b" text-anchor="middle">teks / URL</text>
  <line x1="328" y1="338" x2="250" y2="338" stroke="#0e9f7e" stroke-width="2" marker-end="url(#a)"/>
  <text x="289" y="354" font-size="11" fill="#15123b" text-anchor="middle">JSON hasil</text>

  <!-- output -->
  <text x="450" y="432" font-size="12" fill="#5e5a8a" text-anchor="middle" opacity="0">.</text>
  <text x="40" y="410" font-size="12" fill="#5e5a8a">Hasil: skor, level, temuan + alasan,</text>
  <text x="40" y="427" font-size="12" fill="#5e5a8a">posisi sorotan (UTF-16), kombo, taktik.</text>
</svg>
